# Site settings
title: Fritz's Hobby Site
description: A personal website or project documentation site
author: Fritz
url: "https://yourusername.github.io"
baseurl: ""

# Theme
theme: minima

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Plugins supported by GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude files and directories from the build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Default front matter for pages
defaults:
  - scope:
      path: ""
    values:
      layout: default